# Deux sites web derrière un reverse proxy nginx.
# Le proxy route le trafic selon le nom de domaine demandé.

services:
  site-a:
    image: nginx:alpine
    volumes:
      - ./site-a:/usr/share/nginx/html:ro
    networks:
      - web

  site-b:
    image: nginx:alpine
    volumes:
      - ./site-b:/usr/share/nginx/html:ro
    networks:
      - web

  reverse-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - site-a
      - site-b
    networks:
      - web

networks:
  web:
    driver: bridge
