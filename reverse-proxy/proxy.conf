# Routage par nom de domaine (à tester en ajoutant les entrées dans /etc/hosts)

server {
    listen 80;
    server_name site-a.lab.local;
    location / {
        proxy_pass http://site-a;
    }
}

server {
    listen 80;
    server_name site-b.lab.local;
    location / {
        proxy_pass http://site-b;
    }
}
