# Application Flask + Redis containerisée.
# Points clés : réseau interne isolé pour Redis, secrets via .env,
# limites de ressources, healthcheck.

services:
  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8000:5000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      timeout: 10s
      retries: 3
    networks:
      - intern
      - public
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "128M"

  redis:
    image: "redis:alpine"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file:
      - .env
    volumes:
      - redis_data:/data
    networks:
      - intern          # Redis n'est PAS exposé publiquement
    deploy:
      resources:
        limits:
          memory: "64M"

volumes:
  redis_data:

networks:
  intern:
    driver: bridge
    internal: true       # réseau interne, pas d'accès sortant
  public:
    driver: bridge
